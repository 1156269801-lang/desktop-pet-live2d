<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>动作控制台</title>
<link rel="stylesheet" href="pet.css" />
<link rel="stylesheet" href="ui-tokens.css" />
<link rel="stylesheet" href="console.css" />
</head>
<body class="console-body">
  <div class="console-shell">
    <header class="console-header">
      <h1>动作控制台</h1>
      <button type="button" class="console-close" id="btnClose" title="关闭（Esc）" aria-label="关闭动作控制台">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
      </button>
    </header>
    <div class="console-tools">
      <div class="console-tabs" role="tablist" aria-label="控制类型">
        <button type="button" id="tabMotions" class="console-tab" role="tab" aria-selected="true" aria-controls="motionPanel" tabindex="0">
          动作 <span class="console-count" id="motionCount">0</span>
        </button>
        <button type="button" id="tabExpressions" class="console-tab" role="tab" aria-selected="false" aria-controls="expressionPanel" tabindex="-1">
          表情 <span class="console-count" id="expressionCount">0</span>
        </button>
      </div>
      <div class="console-search">
        <label class="console-sr-only" for="consoleSearch">搜索动作或表情</label>
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" /><path d="m13 13 4 4" /></svg>
        <input id="consoleSearch" type="search" placeholder="搜索动作或表情" autocomplete="off" spellcheck="false" aria-controls="motionList expressList" />
        <button type="button" id="clearSearch" class="console-search-clear" aria-label="清空搜索" title="清空搜索" hidden>
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m6 6 8 8M14 6 6 14" /></svg>
        </button>
      </div>
    </div>
    <main class="console-content" id="consoleContent">
      <section id="motionPanel" class="console-panel" role="tabpanel" aria-labelledby="tabMotions">
        <div class="console-section-head"><h2>选择动作</h2><span id="motionResultCount" class="console-result-count"></span></div>
        <p class="console-note" id="motionNote">开关只记录本窗口的最近请求，不代表角色当前姿势。</p>
        <div class="console-grid" id="motionList" aria-describedby="motionNote"></div>
        <div class="console-empty" id="motionEmpty" hidden><p id="motionEmptyText"></p></div>
      </section>
      <section id="expressionPanel" class="console-panel" role="tabpanel" aria-labelledby="tabExpressions" hidden>
        <div class="console-section-head"><h2>选择表情</h2><span id="expressionResultCount" class="console-result-count"></span></div>
        <div class="console-expression-actions">
          <p class="console-note">清除仅作用于表情，不会复位全部动作。</p>
          <button type="button" id="clearExpression" class="console-secondary" disabled>清除表情</button>
        </div>
        <div class="console-grid" id="expressList"></div>
        <div class="console-empty" id="expressionEmpty" hidden><p id="expressionEmptyText"></p></div>
      </section>
    </main>
    <footer class="console-footer">
      <p class="console-status" id="status" role="status" aria-live="polite" aria-atomic="true">正在读取动作与表情…</p>
      <button type="button" id="retryLoad" class="console-secondary" hidden>重新读取</button>
    </footer>
  </div>
  <script src="console.js"></script>
</body>
</html>
